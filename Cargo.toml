[package]
name = "syncopate-machine"
authors = ["Ruangyot Nanchiang <rayato159@gmail.com>"]
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "A tiny Rust transformer for game NPC/action chat, powered by Burn."
readme = "README.md"
repository = "https://github.com/Rayato159/syncopate-machine"
keywords = ["npc", "chatbot", "transformer", "wasm", "burn"]
categories = ["science", "text-processing"]
include = [
    "src/**",
    "examples/train_action_model.rs",
    "examples/build_action_data.py",
    "examples/action-data/**",
    "docs/**",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "flex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "Window", "Response", "Request", "RequestInit"] }
getrandom = { version = "0.3", optional = true, features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", optional = true, features = ["wasm_js"] }
wgpu = { version = "29", default-features = false, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"], optional = true }

[dev-dependencies]
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[features]
default = []
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
wasm = ["burn/wgpu", "wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "getrandom", "getrandom_04", "dep:wgpu"]
